<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#ffffff 0%,#f1f2fe 100%);position:relative;overflow:hidden;color:#14182b}
  .blob{position:absolute;right:-120px;top:-140px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#c9cbff 0%,rgba(201,203,255,0) 70%)}
  .wrap{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:28px}
  .brand{display:flex;align-items:center;gap:20px}
  .mark{width:84px;height:84px}
  .name{font-size:54px;font-weight:800;letter-spacing:-1.5px}
  h1{font-size:72px;line-height:1.05;font-weight:800;letter-spacing:-2.5px;max-width:880px}
  h1 span{color:#4a46d6}
  p{font-size:28px;color:#586079}
  .bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#4a46d6,#4fd1c0)}
</style></head><body>
<div class="blob"></div>
<div class="wrap">
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5557ea"/><stop offset="1" stop-color="#3a31bd"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><path d="M24 21 13 32l11 11M40 21l11 11-11 11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M35.5 18 28.5 46" fill="none" stroke="#7ee8d6" stroke-width="4.5" stroke-linecap="round"/></svg>
    <div class="name">The CodeRoom</div>
  </div>
  <h1>Software, AI and data solutions <span>built with care.</span></h1>
  <p>Web applications &middot; AI &amp; ML &middot; Analytics &middot; Databases &middot; Automation</p>
</div>
<div class="bar"></div>
</body></html>
